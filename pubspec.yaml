name: fix_rotting
description: "FixRotting is the fun, free app for mastering Computer Science through quick, bite-sized quizzes."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^6.2.1
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/mascots/
    - assets/svgs/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
